version: '3.8'

# Docker Compose example for promisekits (Rails + Sidekiq)
# - This file is an example for development/staging usage.
# - Do NOT store secrets in this file. Use an external .env or your orchestration secrets manager.
# - Environment variables referenced below (e.g. SMTP_PASSWORD) should be provided via .env or runtime secrets.

services:
  redis:
    image: redis:7-alpine
    container_name: promisekits_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  db:
    image: postgres:15
    container_name: promisekits_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-promisekits_production}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-promisekits_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promisekits_web
    command: bash -lc "bundle exec puma -C config/puma.rb"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env             # optional local env file (ignored by git via .gitignore)
    environment:
      RAILS_ENV: ${RAILS_ENV:-production}
      RAILS_SERVE_STATIC_FILES: 'true'
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-promisekits_production}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Mailer/SMTP settings (provide in .env or secrets)
      SMTP_ADDRESS: ${SMTP_ADDRESS}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_DOMAIN: ${SMTP_DOMAIN}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-plain}
      SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      ORDER_EXPORT_RECIPIENT: ${ORDER_EXPORT_RECIPIENT}
      MAILER_HOST: ${MAILER_HOST:-localhost}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    networks:
      - promisekits_net

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promisekits_sidekiq
    command: bash -lc "bundle exec sidekiq -e ${RAILS_ENV:-production} -C config/sidekiq.yml"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      RAILS_ENV: ${RAILS_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-promisekits_production}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SMTP_ADDRESS: ${SMTP_ADDRESS}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_DOMAIN: ${SMTP_DOMAIN}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      ORDER_EXPORT_RECIPIENT: ${ORDER_EXPORT_RECIPIENT}
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    networks:
      - promisekits_net

# Optional: a small service for running one-off Rails tasks locally (migrations, console)
  runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promisekits_runner
    entrypoint: ["bin/sh", "-lc"]
    command: ["bin/rails db:migrate"]
    env_file:
      - .env
    environment:
      RAILS_ENV: ${RAILS_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-promisekits_production}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - db
    networks:
      - promisekits_net
    # This service is not intended to be left running; use `docker compose run --rm runner <cmd>`

volumes:
  db_data:
  redis_data:
  bundle_cache:

networks:
  promisekits_net:
    driver: bridge

# Security & operational notes:
# - Provide secrets via an external `.env` file that is gitignored, or better, Docker secrets / your orchestrator's secrets manager.
# - Example .env (DO NOT COMMIT):
#   POSTGRES_USER=postgres
#   POSTGRES_PASSWORD=very-secret
#   POSTGRES_DB=promisekits_production
#   SMTP_ADDRESS=smtp.gmail.com
#   SMTP_PORT=587
#   SMTP_DOMAIN=yourdomain.com
#   SMTP_USER=reports@yourdomain.com
#   SMTP_PASSWORD=app-password-or-credential
#   DEFAULT_FROM_EMAIL=reports@yourdomain.com
#   ORDER_EXPORT_RECIPIENT=reports@yourdomain.com
#   MAILER_HOST=app.yourdomain.com
#
# - To start the stack:
#   1. create a local .env with the secrets (or set env vars in your environment)
#   2. docker compose build
#   3. docker compose up -d db redis
#   4. docker compose run --rm runner bin/rails db:create db:migrate
#   5. docker compose up -d web sidekiq
#
# - For production, adapt the Dockerfile, environment variables, and process manager (Kubernetes, ECS, systemd, etc.)
#   and ensure you use secure secret management rather than .env files.
