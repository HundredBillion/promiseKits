# Docker Compose for promisekits (Rails + Solid Queue + Redis)
# - This file is for development/staging usage.
# - Do NOT store secrets in this file. Use an external .env or your orchestration secrets manager.
# - Environment variables referenced below should be provided via .env or runtime secrets.
# - The app uses SQLite. Persistent storage is mounted via the sqlite_data volume.

services:
  redis:
    image: redis:7-alpine
    container_name: promisekits_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promisekits_web
    command: bash -lc "bundle exec puma -C config/puma.rb"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env # optional local env file (ignored by git via .gitignore)
    environment:
      RAILS_ENV: ${RAILS_ENV:-production}
      RAILS_SERVE_STATIC_FILES: "true"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Mailer/SMTP settings (provide in .env or secrets)
      SMTP_ADDRESS: ${SMTP_ADDRESS}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_DOMAIN: ${SMTP_DOMAIN}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-plain}
      SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      ORDER_EXPORT_RECIPIENT: ${ORDER_EXPORT_RECIPIENT}
      MAILER_HOST: ${MAILER_HOST:-localhost}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - sqlite_data:/rails/storage
      - bundle_cache:/usr/local/bundle
    networks:
      - promisekits_net

  # Keep the service key during migration so Compose replaces the previous worker.
  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promisekits_jobs
    command: bash -lc "bin/jobs start"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      RAILS_ENV: ${RAILS_ENV:-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SMTP_ADDRESS: ${SMTP_ADDRESS}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_DOMAIN: ${SMTP_DOMAIN}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      ORDER_EXPORT_RECIPIENT: ${ORDER_EXPORT_RECIPIENT}
    volumes:
      - sqlite_data:/rails/storage
      - bundle_cache:/usr/local/bundle
    networks:
      - promisekits_net

  # One-off runner for Rails tasks (migrations, console, etc.)
  # Use: docker compose run --rm runner bin/rails db:migrate
  runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promisekits_runner
    command: ["bin/rails", "db:prepare"]
    env_file:
      - .env
    environment:
      RAILS_ENV: ${RAILS_ENV:-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - sqlite_data:/rails/storage
      - bundle_cache:/usr/local/bundle
    networks:
      - promisekits_net
    # This service is not intended to be left running; use `docker compose run --rm runner <cmd>`

volumes:
  redis_data:
  sqlite_data:
  bundle_cache:

networks:
  promisekits_net:
    driver: bridge

# Security & operational notes:
# - Provide secrets via an external `.env` file that is gitignored, or better, Docker secrets /
#   your orchestrator's secrets manager.
# - Required .env variables:
#   RAILS_MASTER_KEY=<value from config/master.key>
#   SMTP_ADDRESS=smtp.gmail.com
#   SMTP_PORT=587
#   SMTP_DOMAIN=yourdomain.com
#   SMTP_USER=reports@yourdomain.com
#   SMTP_PASSWORD=app-password-or-credential
#   DEFAULT_FROM_EMAIL=reports@yourdomain.com
#   ORDER_EXPORT_RECIPIENT=reports@yourdomain.com
#   MAILER_HOST=app.yourdomain.com
#
# - To start the stack:
#   1. Create a local .env with the required secrets above
#   2. docker compose build
#   3. docker compose run --rm runner bin/rails db:prepare
#   4. docker compose up -d web sidekiq
#
# - SQLite data is persisted in the sqlite_data Docker volume (mounted at /rails/storage).
# - For production, adapt environment variables and ensure you use secure secret management.
