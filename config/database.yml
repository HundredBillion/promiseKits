# SQLite for development/test, PostgreSQL for production
#   Ensure the database gems are defined in your Gemfile:
#     gem "sqlite3", ">= 2.1"  (development/test)
#     gem "pg", "~> 1.5"       (production)
#
# In production, set DATABASE_URL env var to override the default:
#   DATABASE_URL=postgres://user:password@host:5432/dbname

default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

production:
  primary:
    url: <%= ENV["DATABASE_URL"] || "sqlite3:storage/production.sqlite3" %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    timeout: 5000
  cache:
    url: <%= ENV["DATABASE_URL"] || "sqlite3:storage/production_cache.sqlite3" %>
    migrations_paths: db/cache_migrate
  queue:
    url: <%= ENV["DATABASE_URL"] || "sqlite3:storage/production_queue.sqlite3" %>
    migrations_paths: db/queue_migrate
  cable:
    url: <%= ENV["DATABASE_URL"] || "sqlite3:storage/production_cable.sqlite3" %>
    migrations_paths: db/cable_migrate
