# Sidekiq Scheduler configuration for Order Exports
# Schedules Admin::SendOrderExportJob to run on Monday, Wednesday, and Friday
# at 07:00 in the America/New_York timezone.
#
# Note:
# - The job will be enqueued by sidekiq-scheduler at the local time specified by `tz`.
# - The job implementation should derive the canonical `scheduled_for` time from
#   Time.current.utc (or from the job argument if you choose to pass one).
#
# Cron syntax: minute hour day month weekday
# Weekday values: 0-6 (Sun-Sat) or names (MON,WED,FRI). We use weekday names for clarity.

send_order_export_job:
  cron: "0 7 * * MON,WED,FRI"
  tz: "America/New_York"
  class: "Admin::SendOrderExportJob"
  queue: "default"
  description: "Scheduled export of orders and email (Mon/Wed/Fri at 07:00 America/New_York)"
  enabled: true
  args: []

florida_orders_export_job:
  cron: "0 7 1 * *"
  tz: "America/New_York"
  class: "AdminReports::FloridaOrdersExportJob"
  queue: "default"
  description: "Monthly Florida orders summary (1st of month at 07:00 America/New_York)"
  enabled: true
  args: []
