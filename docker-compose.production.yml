# Docker Compose for promisekits PRODUCTION with PostgreSQL
# - Use this for staging/production deployments
# - Do NOT store secrets in this file. Use an external .env or your orchestration secrets manager.
# - Environment variables referenced below should be provided via .env or runtime secrets.

services:
  postgres:
    image: postgres:16-alpine
    container_name: promisekits_postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-promisekits_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-promisekits_production}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - promisekits_net

  redis:
    image: redis:7-alpine
    container_name: promisekits_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - promisekits_net

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: promisekits_web
    command: bash -lc "bundle exec puma -C config/puma.rb"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-promisekits_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SMTP_ADDRESS: ${SMTP_ADDRESS}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_DOMAIN: ${SMTP_DOMAIN}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-plain}
      SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      ORDER_EXPORT_RECIPIENT: ${ORDER_EXPORT_RECIPIENT}
      MAILER_HOST: ${MAILER_HOST}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - bundle_cache:/usr/local/bundle
    networks:
      - promisekits_net

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: promisekits_sidekiq
    command: bash -lc "bundle exec sidekiq -e production -C config/sidekiq.yml"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-promisekits_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SMTP_ADDRESS: ${SMTP_ADDRESS}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_DOMAIN: ${SMTP_DOMAIN}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      ORDER_EXPORT_RECIPIENT: ${ORDER_EXPORT_RECIPIENT}
    volumes:
      - bundle_cache:/usr/local/bundle
    networks:
      - promisekits_net

  runner:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: promisekits_runner
    entrypoint: ["/bin/sh", "-lc"]
    command: ["bin/rails db:migrate"]
    env_file:
      - .env
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-promisekits_production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bundle_cache:/usr/local/bundle
    networks:
      - promisekits_net

volumes:
  postgres_data:
  redis_data:
  bundle_cache:

networks:
  promisekits_net:
    driver: bridge

# Usage:
# 1. Create a production .env with real secrets:
#    POSTGRES_PASSWORD=<secure-password>
#    POSTGRES_DB=promisekits_production
#    RAILS_MASTER_KEY=<from config/master.key>
#
# 2. Build and start:
#    docker compose -f docker-compose.production.yml build
#    docker compose -f docker-compose.production.yml up -d
#
# 3. Run migrations:
#    docker compose -f docker-compose.production.yml run --rm runner bin/rails db:migrate
#
# For Kamal deployment, use: kamal deploy
